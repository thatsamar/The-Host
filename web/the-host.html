<title>The Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#ECEEF1; --surface:#FFFFFF; --ink:#16181D; --muted:#5E6470; --line:#D5D9DF;
  --accent:#8A6424; --accent-soft:#F1E7D4; --user:#1F2B3A; --user-ink:#F2F0EA; --warn:#9A3B2E;
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111317; --surface:#1A1D22; --ink:#ECE8E0; --muted:#9AA0AA; --line:#2C3038;
    --accent:#D2A861; --accent-soft:#2D2619; --user:#2A3647; --user-ink:#F2F0EA; --warn:#E08A7B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#111317; --surface:#1A1D22; --ink:#ECE8E0; --muted:#9AA0AA; --line:#2C3038;
  --accent:#D2A861; --accent-soft:#2D2619; --user:#2A3647; --user-ink:#F2F0EA; --warn:#E08A7B;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px}
.app{max-width:620px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:22px 10px;border-bottom:1px solid var(--line)}
.mark{font:italic 500 30px/1 var(--display);letter-spacing:-.01em;margin:0}
.tag{color:var(--muted);font-size:13px;margin:0}
.tools{display:flex;gap:14px}
.link{background:none;border:0;padding:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
button:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.memory{border-bottom:1px solid var(--line);padding-block:12px;font-size:14px}
.memory h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.memory ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.memory li{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 11px;background:var(--surface)}
.memory li button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
.memory p{margin:0;color:var(--muted)}

main{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:22px 18px}
.intro h1{font:italic 500 clamp(34px,8vw,46px)/1.05 var(--display);margin:6px 0 10px;text-wrap:balance}
.intro p{color:var(--muted);margin:0 0 16px;max-width:46ch}

.msg{max-width:88%}
.msg.user{align-self:flex-end;background:var(--user);color:var(--user-ink);padding:9px 14px;border-radius:18px 18px 4px 18px;white-space:pre-wrap}
.msg.host{align-self:flex-start;display:flex;flex-direction:column;gap:10px;max-width:100%}
.lead{margin:0;font-size:17px}
.q{display:flex;flex-direction:column;gap:7px}
.q p{margin:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{white-space:nowrap;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip:disabled{cursor:default;opacity:.55}
.chip.go{background:var(--ink);color:var(--ground);border-color:var(--ink)}

.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.plan section{padding:14px 16px;display:grid;grid-template-columns:88px 1fr;gap:12px;border-top:1px solid var(--line)}
.plan section:first-child{border-top:0}
.plan h3{margin:2px 0 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.plan section.do h3{color:var(--accent)}
.plan section.avoid h3{color:var(--warn)}
.plan p{margin:0}
.plan section.do p{font-size:17px}
.action{margin:0;font-weight:500}
.meta{display:flex;gap:14px;align-items:center}
.thinking{color:var(--muted);font-style:italic}
.thinking::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion: reduce){.thinking::after{animation:none;content:"…"}}
.error{color:var(--warn);font-size:14px;margin:0}
.detail{white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,Menlo,monospace;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;max-height:260px;overflow:auto}

.composer{position:sticky;bottom:0;background:var(--ground);padding-block:10px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;min-height:46px;max-height:140px}
textarea::placeholder{color:var(--muted)}
.send{font:inherit;font-weight:600;background:var(--ink);color:var(--ground);border:0;border-radius:14px;padding:0 18px;height:46px;cursor:pointer}
.send:disabled{opacity:.4;cursor:default}
.fine{color:var(--muted);font-size:12px;margin:8px 2px 0}
@media (max-width:420px){.plan section{grid-template-columns:1fr;gap:4px}}
</style>

<div class="app">
  <header>
    <div>
      <p class="mark">The Host</p>
    </div>
    <div class="tools">
      <button class="link" id="memToggle" type="button" aria-expanded="false">What I know about you</button>
      <button class="link" id="reset" type="button">Start over</button>
    </div>
  </header>
  <div class="memory" id="memory" hidden>
    <h2>Taste memory</h2>
    <ul id="memList"></ul>
    <p id="memEmpty">Nothing yet. I learn from what you tell me, not from a survey.</p>
  </div>

  <main id="thread" aria-live="polite">
    <div class="intro" id="intro">
      <h1>How can I help you?</h1>
    </div>
  </main>

  <div class="composer">
    <form class="row" id="form">
      <textarea id="box" rows="1" aria-label="Message The Host" placeholder="" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit">Ask</button>
    </form>
    <p class="fine" id="fine">Early prototype. Check hours before you go; booking isn't live yet.</p>
  </div>
</div>

<script>
const RULES = `You are The Host. People message you when they're in a city and want a good night: dinner, drinks, an afternoon, a night out with friends or clients. You're like a well-travelled friend who knows the city and has good taste. You don't hand people a list; you tell them what you'd do.

HOW YOU WORK
- Don't ask questions. Whatever they send, however little, answer straight away with a plan. Fill in what they didn't say with the most likely reading (who's coming, how big a night, where they are) and mention the one or two assumptions that matter in a short, natural line, e.g. "Sounds like it's just you and you want an easy one. If not, tell me." They'll reply in their own words if you guessed wrong; then adjust.
- When they're looking after other people (clients, family, a birthday, investors), still give the plan first. If something could genuinely go wrong, like dietary needs, mention it in passing ("If anyone's vegetarian, this still works.") rather than asking.
- A plan has four parts: DO THIS (the plan, with rough timing, the neighbourhood, and where to sit), BACKUP (one alternative if it's full or plans change), AVOID (the one mistake to steer clear of), ACTION (optional: one easy line about the next step, like "Book the 8:30 if you can." or "Happy to rework it if the night changes.").
- Think about the occasion as well as the person. Solo and exhausted after a long week is different from solo and up for a big night.
- If what they ask for doesn't fit what they like, say so kindly in a sentence and suggest what you'd do instead.
- Keep it practical. Stay close to where they are and don't send them back and forth across town.

BE SPECIFIC
- If they don't say where they are, pick the best area for the occasion yourself and say so in passing, e.g. "I'm assuming you're around South Congress." 
- Talk about areas the way people who live there do (in New York, "Downtown" or "Brooklyn"; in Austin, "East Austin" or "Clarksville"), not in guidebook zones like "the arts district". In the plan, get specific: the exact neighbourhood, the street or corner.
- In a plan, name the actual places, the street or corner, a time, where to sit, and one thing to order. "Get a seat at the bar at [place] on [street] around 7:30 and order the [dish]" beats "find a cosy spot for dinner".
- If a detail isn't something you're sure of, leave that detail out rather than going vague on the whole plan.

VENUES
- Name real places whenever you're confident they exist and are still open; prefer established places over new openings. Never make up a place, hours, prices, or availability. If you're unsure, describe the kind of place and the area instead.
- Booking isn't connected yet. If they say yes to booking, tell them simply how to get the table (how the place usually takes bookings, or when to walk in). Never say you booked or held anything.

TASTE
You like places with some life in them, local character over imported luxury, rooms that feel put together rather than decorated, and good service that isn't stiff. A seat at the bar is often better than a table. A good night has a natural flow: somewhere to start, a main event, and an easy way to wrap up. One nice surprise is plenty.
You're wary of places that are famous mostly for being famous, rooms full of people filming their food, long tasting menus unless they're genuinely special, private rooms for small groups, and over-planned evenings.
You don't mind a bit of imperfection: a plain room with great food is fine, and a beautiful room with so-so food is fine for a drink.
Rough defaults: just landed and alone = stay close, eat at the bar, maybe one drink after, early night. Early date = relaxed, with an easy second stop nearby. Anniversary = a lovely room, good service, book the earlier time. Client dinner = lively but polished, central, easy to leave, no tasting menu, check dietary needs. Old friends = noise is fine, sharing plates, let it run late. Family or a teenager = don't cram it; a walk, one thing they'll love, a café, one surprise.

VOICE
Write the way a friend texts back: warm, relaxed, plain words, normal full sentences, contractions. Have an opinion, but say it easily. Give a quick reason when it helps. Keep it short since it's a text, but don't make it clipped or punchy. No slogans, catchphrases, wordplay, or trying to sound cool or clever. No gushing, no hedging, no lists of options.
Sounds like: "I'd stay in Roma tonight. You'll be tired, and everything good is walkable." "Try to get a seat at the bar; it's the best spot in the room." "Book the 8:00 if you can, it gets busy later." "I'd skip dessert there and grab a drink next door instead."
Avoid travel-brochure words: unforgettable experience, hidden gem, culinary journey, vibrant neighborhood, perfect for foodies, elevated yet approachable, must-visit, must-try, foodie, nestled, bustling, tucked away, bucket list.

OUTPUT
Reply with only one JSON object, no other text:
{"kind":"plan","lead":string,"questions":[],"do_this":string,"backup":string,"avoid":string,"action":string,"learned":[string]}
- kind is always "plan" and questions is always []. do_this is required.
- Every other value is ONE plain string. For a whole night, write do_this as one short paragraph covering each stop in order; never an array or nested object.
- lead: an optional friendly opening line, including any assumption worth mentioning, else "".
- learned: durable taste signals about this user revealed in their latest message (e.g. "prefers counter seating", "hates rooms full of people filming dinner"). Not logistics like city or date. Usually [].`;

const BANNED = ["hidden gem","unforgettable experience","culinary journey","vibrant neighborhood","perfect for foodies","elevated yet approachable","must-visit","must-try","foodie","nestled","bustling","tucked away"];

const $ = (id) => document.getElementById(id);
const thread = $("thread"), box = $("box"), send = $("send"), form = $("form");
let turns = [];            // [{role, content}] the page keeps; Claude keeps nothing
let busy = false, ctl = null, sample = null;

// Taste memory: per-viewer, in this browser only.
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("host.memory") || "[]"); } catch { return []; } },
  set(v){ try { localStorage.setItem("host.memory", JSON.stringify(v)); } catch {} },
};
let memory = store.get();

function el(tag, attrs = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}

function renderMemory(){
  const list = $("memList"); list.replaceChildren();
  memory.forEach((m, i) => list.append(el("li", {}, m,
    el("button", {type:"button", "aria-label":`Forget: ${m}`, onclick(){ memory.splice(i,1); store.set(memory); renderMemory(); }}, "×"))));
  $("memEmpty").hidden = memory.length > 0;
}
$("memToggle").onclick = () => {
  const m = $("memory"); m.hidden = !m.hidden;
  $("memToggle").setAttribute("aria-expanded", String(!m.hidden));
};

function remember(notes){
  const seen = new Set(memory.map(m => m.toLowerCase()));
  for (const n of notes || []) {
    const t = String(n).trim();
    if (t && !seen.has(t.toLowerCase())) { memory.push(t); seen.add(t.toLowerCase()); }
  }
  store.set(memory); renderMemory();
}


function scrollDown(){ window.scrollTo({top: document.body.scrollHeight, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }

function asText(r){
  const parts = r.lead ? [r.lead] : [];
  if (r.kind === "ask") r.questions.forEach(q => parts.push(q.prompt));
  else {
    parts.push(r.do_this);
    if (r.backup) parts.push("Plan B: " + r.backup);
    if (r.avoid) parts.push("I'd skip: " + r.avoid);
    if (r.action) parts.push(r.action);
  }
  return parts.join("\n\n");
}

function renderPlan(r, wrap){
  const card = el("div", {class:"plan"});
  const sec = (cls, label, text) => text && card.append(el("section", {class:cls}, el("h3", {}, label), el("p", {}, text)));
  sec("do", "The plan", r.do_this); sec("backup", "Plan B", r.backup); sec("avoid", "I'd skip", r.avoid);
  wrap.append(card);
  if (r.action) wrap.append(el("p", {class:"action"}, r.action));
  const copyBtn = el("button", {class:"link", type:"button"}, "Copy plan");
  copyBtn.onclick = async () => {
    try { await navigator.clipboard.writeText(asText(r)); copyBtn.textContent = "Copied"; }
    catch { copyBtn.textContent = "Select the text to copy"; }
  };
  wrap.append(el("div", {class:"meta"}, copyBtn));
}

const COPY = {
  not_granted: "The Host needs your OK to use Claude on this page. Reload to be asked again.",
  sampling_disabled: "Claude isn't available on this account.",
  rate_limited: "That was a lot at once. Give it a minute, then send again.",
  session_expired: "Your Claude session expired. Sign in again, then send.",
  refused: "I can't help with that one. Try asking a different way.",
  empty_completion: "No answer came back. Try again, maybe with a bit more detail.",
  invalid_json: "I couldn't read that answer. Send it again, or tap Show details and send me what it says.",
  prompt_too_large: "This chat got long. Start over to keep going.",
};

// Pull the first complete JSON object out of the reply, tolerating code fences or a stray sentence.
function parseReply(text){
  const t = String(text || "");
  for (let start = t.indexOf("{"); start !== -1; start = t.indexOf("{", start + 1)) {
    let depth = 0, inStr = false, esc = false;
    for (let i = start; i < t.length; i++) {
      const c = t[i];
      if (inStr) { if (esc) esc = false; else if (c === "\\") esc = true; else if (c === '"') inStr = false; continue; }
      if (c === '"') inStr = true;
      else if (c === "{") depth++;
      else if (c === "}" && --depth === 0) {
        try { return JSON.parse(t.slice(start, i + 1)); } catch { break; }
      }
    }
  }
  return null;
}

const sentences = (xs) => xs.map(flat).filter(Boolean).map(x => /[.!?]$/.test(x) ? x : x + ".").join(" ");
const flat = (v) => v == null ? "" : typeof v === "string" ? v.trim()
  : Array.isArray(v) ? sentences(v)
  : typeof v === "object" ? sentences(Object.values(v)) : String(v);
const pick = (o, ...keys) => { for (const k of keys) if (o && o[k] != null && flat(o[k])) return flat(o[k]); return ""; };

// Accept the reply even when the model nests or renames fields.
function normalize(o){
  if (!o || typeof o !== "object") return null;
  const src = {...o, ...(o.plan && typeof o.plan === "object" && !Array.isArray(o.plan) ? o.plan : {})};
  const r = {
    lead: pick(src, "lead", "intro", "opening"),
    do_this: pick(src, "do_this", "doThis", "the_plan", "plan", "steps", "itinerary"),
    backup: pick(src, "backup", "plan_b", "planB"),
    avoid: pick(src, "avoid", "skip"),
    action: pick(src, "action", "next_step", "next"),
    learned: Array.isArray(o.learned) ? o.learned : [],
    questions: (Array.isArray(o.questions) ? o.questions : []).map(q =>
      typeof q === "string" ? {prompt:q, choices:[]} : {prompt: flat(q && (q.prompt || q.question)), choices: (Array.isArray(q && q.choices) ? q.choices : []).map(flat).filter(Boolean)}
    ).filter(q => q.prompt).slice(0, 3).map(q => ({...q, choices: q.choices.slice(0, 4)})),
  };
  r.kind = r.do_this ? "plan" : r.questions.length ? "ask" : null;
  if (o.kind === "ask" && r.questions.length) r.kind = "ask";
  return r.kind ? r : null;
}

async function ask(text){
  text = text.trim();
  if (!text || busy) return;
  if (!sample) { thread.append(el("p", {class:"error"}, "Open this page in Claude to talk to The Host.")); return; }
  $("intro").hidden = true;
  thread.append(el("div", {class:"msg user"}, text));
  box.value = ""; autosize();
  turns.push({role:"user", content:text});

  const wrap = el("div", {class:"msg host"}, el("p", {class:"thinking"}, "Thinking"));
  thread.append(wrap); scrollDown();
  busy = true; send.disabled = true;

  const known = memory.length ? "What you already know about this user:\n- " + memory.join("\n- ") : "New user. Nothing known yet.";
  const input = [{role:"user", content: RULES + "\n\n" + known + "\n\nThe conversation starts now."}, ...turns.slice(-16)];
  ctl = new AbortController();
  let raw = "";
  try {
    const res = await sample(input, {cache:false, signal: ctl.signal});
    raw = res.text;
    const r = normalize(parseReply(raw));
    wrap.replaceChildren();
    if (!r) {
      // Couldn't read it as a structured reply; show what The Host said as plain text.
      const prose = raw.replace(/```[a-z]*|```/gi, "").trim();
      if (!prose || /^[\[{]/.test(prose)) throw {code:"invalid_json", text: raw};
      wrap.append(el("p", {class:"lead"}, prose));
      turns.push({role:"assistant", content: prose});
      return;
    }
    if (r.lead) wrap.append(el("p", {class:"lead"}, r.lead));
    if (r.kind === "ask") r.questions.forEach(q => wrap.append(el("p", {class:"lead"}, q.prompt)));
    else renderPlan(r, wrap);
    const said = asText(r);
    const dead = BANNED.filter(b => said.toLowerCase().includes(b));
    if (dead.length) console.warn("Brochure language slipped through:", dead);
    turns.push({role:"assistant", content: said});
    remember(r.learned);
  } catch (e) {
    turns.pop();
    wrap.replaceChildren(el("p", {class:"error"}, COPY[e?.code] || "Something went wrong on the way. Send it again."));
    if (e?.code !== "cancelled") {
      box.value = text; autosize();
      const detail = [`code: ${e?.code || "unknown"}`, e?.message, (e?.text || raw || "").slice(0, 1500)].filter(Boolean).join("\n\n");
      const pre = el("pre", {class:"detail", hidden:""}, detail);
      const t = el("button", {class:"link", type:"button", onclick(){ pre.hidden = !pre.hidden; t.textContent = pre.hidden ? "Show details" : "Hide details"; }}, "Show details");
      wrap.append(el("div", {class:"meta"}, t), pre);
    }
  } finally {
    busy = false; send.disabled = false; scrollDown();
  }
}

function autosize(){ box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 140) + "px"; }
box.addEventListener("input", autosize);
box.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(box.value); } });
form.addEventListener("submit", e => { e.preventDefault(); ask(box.value); });

$("reset").onclick = () => {
  ctl?.abort(); turns = []; busy = false; send.disabled = false;
  thread.querySelectorAll(".msg, .error").forEach(n => n.remove());
  $("intro").hidden = false; box.value = ""; autosize();
};

renderMemory();
(async () => {
  sample = await window.claude?.use?.("sample") ?? null;
  if (!sample) {
    send.disabled = true; box.disabled = true;
    $("fine").textContent = "Open this page in Claude to talk to The Host.";
  }
})();
</script>
