[project]
name = "the-host"
version = "0.1.0"
description = "The Host: judgment at speed. SMS-style prototype with human review."
requires-python = ">=3.10"
dependencies = ["anthropic>=1.8"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
host-cli = "host.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["host"]
